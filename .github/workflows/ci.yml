name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Version lue dans engines.node, comme Vercel : la CI teste sur la même
      # majeure que la prod (.nvmrc ne sert qu'à nvm en local).
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      # Aucun secret réel : la validation env reste active au runtime, et la clé
      # Clerk factice sert seulement au prérendu (Clerk refuse de builder sans).
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          SENTRY_AUTH_TOKEN: ""
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ci-placeholder
