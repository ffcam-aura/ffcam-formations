version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Un seul PR par lot pour limiter la charge de revue. Les majeures sont
      # exclues des groupes : mélangées, elles donnent un PR trop gros pour être
      # relu et qui échoue en bloc. Elles arrivent donc une par une.
      production-patch-minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # Les actions vivent toutes dans les deux mêmes fichiers : en PR séparés,
      # le premier merge met les autres en conflit.
      github-actions:
        patterns: ["*"]
